<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTeen GN icon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=block" rel="stylesheet">
<style>
  :root { --bg: #e9edf2; --ink: #13202c; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
  h2 { font: 800 15px system-ui; margin: 0 0 10px; }
  .grid { display: flex; gap: 36px; flex-wrap: wrap; }
  .opt { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .opt img.big { width: 260px; height: 260px; border-radius: 22.37%; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .opt img.mid { width: 76px; height: 76px; border-radius: 17px; }
  .opt img.small { width: 52px; height: 52px; border-radius: 12px; }
  button { font: 600 14px system-ui; padding: 8px 14px; border-radius: 10px; border: 0; background: #159fdc; color: #fff; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<p id="status"></p>
<script>
// Three directions for the CTeen GN icon (1024 x 1024). Each draws a geometric CTeen "C":
// a bold ring with rounded ends, open on the right, with a small CTeen-tan dot.
const S = 1024;
const TAN = '#E8B478';

function ringC(ctx, cx, cy, r, w, color) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = w;
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, (40 * Math.PI) / 180, (320 * Math.PI) / 180, false);
  ctx.stroke();
  ctx.restore();
}
function dot(ctx, x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function tracked(ctx, text, cx, y, size, color, spacing) {
  ctx.save();
  ctx.font = `800 ${size}px Manrope`;
  ctx.letterSpacing = spacing + 'px';
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(text, cx + spacing / 2, y);
  ctx.restore();
}
function glow(ctx, x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
}

const VARIANTS = {
  // A: deep midnight blue, white C, tan dot, small tracked GREAT NECK.
  midnight(ctx) {
    const g = ctx.createLinearGradient(0, 0, S, S);
    g.addColorStop(0, '#0f3d68'); g.addColorStop(1, '#071a2e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    glow(ctx, 300, 220, 700, 'rgba(43,199,247,0.35)');
    ringC(ctx, 512, 462, 228, 118, '#ffffff');
    dot(ctx, 700, 462, 46, TAN);
    tracked(ctx, 'GREAT NECK', 512, 880, 62, 'rgba(255,255,255,0.78)', 18);
  },
  // B: bright CTeen blue with a frosted glass tile, iOS 26 style.
  glass(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, '#3dd0fb'); g.addColorStop(1, '#0b6fb0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    glow(ctx, 820, 160, 520, 'rgba(255,255,255,0.35)');
    glow(ctx, 160, 900, 520, 'rgba(232,180,120,0.35)');
    // glass tile
    const x = 182, y = 182, w = 660, h = 660, r = 170;
    ctx.save();
    ctx.shadowColor = 'rgba(5,40,80,0.35)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
    const sheen = ctx.createLinearGradient(0, y, 0, y + h);
    sheen.addColorStop(0, 'rgba(255,255,255,0.45)'); sheen.addColorStop(0.45, 'rgba(255,255,255,0.06)'); sheen.addColorStop(1, 'rgba(255,255,255,0.12)');
    ctx.fillStyle = sheen; ctx.fillRect(x, y, w, h);
    ctx.restore();
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.roundRect(x + 3, y + 3, w - 6, h - 6, r - 3); ctx.stroke();
    ringC(ctx, 512, 512, 170, 92, '#ffffff');
    dot(ctx, 652, 512, 36, TAN);
  },
  // C: grown-up version of the CTeen tile: deep blue over tan, GREAT NECK in the tan band.
  split(ctx) {
    const band = 742;
    const g = ctx.createLinearGradient(0, 0, 0, band);
    g.addColorStop(0, '#1aa9e6'); g.addColorStop(1, '#0c6aa8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, band);
    glow(ctx, 280, 160, 560, 'rgba(255,255,255,0.22)');
    const t = ctx.createLinearGradient(0, band, 0, S);
    t.addColorStop(0, '#efc28c'); t.addColorStop(1, '#e0a865');
    ctx.fillStyle = t; ctx.fillRect(0, band, S, S - band);
    ringC(ctx, 512, 392, 210, 108, '#ffffff');
    dot(ctx, 684, 392, 42, TAN);
    tracked(ctx, 'GREAT NECK', 512, 912, 74, '#0b3a5e', 14);
  },
};

async function render(name) {
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  VARIANTS[name](c.getContext('2d'));
  return c.toDataURL('image/png');
}

async function main() {
  await document.fonts.load('800 60px Manrope');
  const grid = document.getElementById('grid');
  window.__icons = {};
  for (const [i, name] of Object.keys(VARIANTS).entries()) {
    const url = await render(name);
    window.__icons[name] = url;
    const box = document.createElement('div');
    box.className = 'opt';
    box.innerHTML = `<h2>${'ABC'[i]}: ${name}</h2><img class="big" alt="${name}"><div class="row"><img class="mid" alt=""><img class="small" alt=""></div><button>Use ${name}</button>`;
    box.querySelectorAll('img').forEach((im) => (im.src = url));
    box.querySelector('button').onclick = async () => {
      const r = await fetch('/save', { method: 'POST', body: url });
      document.getElementById('status').textContent = `${name}: ${await r.text()}`;
    };
    grid.appendChild(box);
  }
  return Object.keys(window.__icons);
}
window.__ready = main();
</script>
</body>
</html>
