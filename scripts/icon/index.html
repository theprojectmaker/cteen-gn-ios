<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTeen GN icon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=block" rel="stylesheet">
<style>
  :root { --bg: #eef2f6; --ink: #13202c; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
  .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  #big { width: min(512px, 100%); height: auto; border-radius: 22.37%; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  #mid { width: 120px; height: 120px; border-radius: 27px; }
  #small { width: 60px; height: 60px; border-radius: 13px; }
  button { margin-top: 16px; font: 600 15px system-ui; padding: 10px 18px; border-radius: 10px; border: 0; background: #159fdc; color: #fff; }
</style>
</head>
<body>
<div class="row">
  <canvas id="c" width="1024" height="1024" hidden></canvas>
  <img id="big" alt="Icon, large">
  <img id="mid" alt="Icon, medium">
  <img id="small" alt="Icon, home-screen size">
</div>
<button id="save">Save to assets/icon.png</button>
<p id="status"></p>
<script>
// CTeen GN icon (1024 x 1024): CTeen's blue and tan panels as gradients, the
// logo's white C and "teen" lifted out as letters with a sticker shadow,
// "GREAT NECK" curved over the top like a badge, and a wave where the blue
// meets the sand (Great Neck is on the water).
const TEXT = 'GREAT NECK';
const S = 1024;

// Cut the white lettering out of one panel of the logo: alpha = how white each pixel is.
function letters(logo, sx, sy, sw, sh, bgChannel, bgValue) {
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const x = c.getContext('2d');
  x.drawImage(logo, sx, sy, sw, sh, 0, 0, sw, sh);
  const img = x.getImageData(0, 0, sw, sh), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = Math.max(0, Math.min(1, (d[i + bgChannel] - bgValue) / (255 - bgValue)));
    d[i] = d[i + 1] = d[i + 2] = 255;
    d[i + 3] = Math.round(a * a * (3 - 2 * a) * 255);
  }
  x.putImageData(img, 0, 0);
  // Tight bounds of the lettering
  let x0 = sw, y0 = sh, x1 = 0, y1 = 0;
  for (let y = 0; y < sh; y++) for (let xx = 0; xx < sw; xx++) if (d[(y * sw + xx) * 4 + 3] > 40) { x0 = Math.min(x0, xx); x1 = Math.max(x1, xx); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { canvas: c, x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function drawLetters(ctx, L, cx, top, height, shadow) {
  const w = (L.w / L.h) * height;
  ctx.save();
  ctx.shadowColor = shadow;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = height * 0.035;
  ctx.shadowBlur = 0;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(L.canvas, L.x0, L.y0, L.w, L.h, cx - w / 2, top, w, height);
  ctx.restore();
}

// Text along the top of a circle, letter by letter.
function arcText(ctx, text, cx, cy, r, color, shadow) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const widths = [...text].map((ch) => ctx.measureText(ch).width);
  const gap = ctx.measureText('M').width * 0.035;
  const total = widths.reduce((a, b) => a + b, 0) + gap * (text.length - 1);
  let angle = -Math.PI / 2 - total / r / 2;
  [...text].forEach((ch, i) => {
    const half = widths[i] / 2 / r;
    angle += half;
    ctx.save();
    ctx.translate(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.rotate(angle + Math.PI / 2);
    ctx.fillStyle = shadow; ctx.fillText(ch, 0, 9);
    ctx.fillStyle = color; ctx.fillText(ch, 0, 0);
    ctx.restore();
    angle += half + gap / r;
  });
  ctx.restore();
}

async function draw() {
  await document.fonts.load('700 120px Fredoka');
  const logo = new Image();
  logo.src = '/logo.png';
  await logo.decode();

  // Where the logo turns from blue to tan
  const probe = document.createElement('canvas');
  probe.width = logo.width; probe.height = logo.height;
  const pc = probe.getContext('2d');
  pc.drawImage(logo, 0, 0);
  const px = pc.getImageData(0, 0, logo.width, logo.height).data;
  let split = 0;
  for (let y = 20; y < logo.height; y++) { const i = (y * logo.width + 12) * 4; if (px[i] > 180 && px[i + 2] < 160) { split = y; break; } }

  const C = letters(logo, 8, 8, logo.width - 16, split - 10, 0, 43);                 // white on blue: use red channel
  const teen = letters(logo, 8, split + 4, logo.width - 16, logo.height - split - 14, 2, 122); // white on tan: use blue channel

  const ctx = document.getElementById('c').getContext('2d');

  // Sky-blue panel with a soft light in the upper left
  let g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, '#3fd2fb'); g.addColorStop(0.75, '#16a6e2'); g.addColorStop(1, '#0f8fd0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  g = ctx.createRadialGradient(260, 170, 20, 260, 170, 620);
  g.addColorStop(0, 'rgba(255,255,255,0.28)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);

  // Sand band with a wavy top edge, plus a thin foam line
  const bandTop = 800, amp = 16;
  const wave = (x) => bandTop + amp * Math.sin((x / S) * Math.PI * 2 * 1.5 + 0.6);
  const sandPath = () => { ctx.beginPath(); ctx.moveTo(0, S); for (let x = 0; x <= S; x += 8) ctx.lineTo(x, wave(x)); ctx.lineTo(S, S); ctx.closePath(); };
  ctx.save(); ctx.translate(0, -14); sandPath(); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill(); ctx.restore();
  sandPath();
  g = ctx.createLinearGradient(0, bandTop - amp, 0, S);
  g.addColorStop(0, '#f3c48f'); g.addColorStop(1, '#e2a764');
  ctx.fillStyle = g; ctx.fill();

  // Letters
  drawLetters(ctx, C, S / 2, 292, 452, 'rgba(8, 70, 130, 0.35)');
  drawLetters(ctx, teen, S / 2, 838, 140, 'rgba(150, 90, 30, 0.35)');

  // GREAT NECK over the top
  ctx.font = '700 116px Fredoka';
  arcText(ctx, TEXT, S / 2, 1030, 800, '#ffffff', 'rgba(8, 70, 130, 0.32)');

  const url = document.getElementById('c').toDataURL('image/png');
  for (const id of ['big', 'mid', 'small']) document.getElementById(id).src = url;
  window.__icon = { url, split };
  return window.__icon;
}

document.getElementById('save').onclick = async () => {
  const r = await fetch('/save', { method: 'POST', body: window.__icon.url });
  document.getElementById('status').textContent = await r.text();
};
window.__ready = draw();
</script>
</body>
</html>
